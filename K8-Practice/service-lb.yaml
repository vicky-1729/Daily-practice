apiVersion: v1
kind: Service
metadata:
  name: nginx-lb
spec:
   # loadbalancer
  type: LoadBalancer

  selector: 
   # labels belongs to pod
    purpose: service-lb-demo
    project: roboshop
    app: backend
  ports:
    - protocol: TCP
      port: 80 # service
      targetPort: 80 # continer port

---

# pod defination

apiVersion: v1
kind: Pod
metadata:
  name: nginx-lb
  labels:
    purpose: service-lb-demo
    project: roboshop
    app: backend

spec:
  containers:
  - name: nginx
    image: nginx



---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  labels:
    project: roboshop
    env: test
spec:
  replicas: 3
  selector:
    matchLabels:
      #pod labels
      purpose: service-lb-demo
      project: roboshop
      app: backend
  templates:
    metadata:
      labels:
        purpose: service-lb-demo
        project: roboshop
        app: backend
    spec:
      containers:
        - name: 
          image:
          resources:
            request:
              cpu:
              mem:
            limits:
              cpu:
              mem:
          envFrom:
            configMapRef:
              name:
            configScretRef:
             name