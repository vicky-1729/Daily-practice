apiVersion: v1
kind: Service
metadata:
  name: Nginx-Service
spec:
  selector:
    # pod labels
    purpose: service-demo
    tier: app
    project: roboshop
  ports:
    - protocol: TCP
      port: 80 # serviec port
      targetPort: 80  # container port

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    purpose: service-demo
    tier: app
    project: roboshop
spec:
  containers:
  - name: nginx
    image: nginx
